name: Release

# A new version in metadata.txt reaching master is released, once the tests pass
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' MemoryLayerSaverDanzig/metadata.txt | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: check
    if: needs.check.outputs.released == 'false'
    uses: ./.github/workflows/tests.yml

  release:
    needs: [check, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the plugin zip and the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "No $VERSION section in CHANGELOG.md"; exit 1; }
          zip -r -X "MemoryLayerSaverDanzig-$VERSION.zip" MemoryLayerSaverDanzig -x '*/__pycache__/*' '*.pyc'
          {
            echo "This is a fork of [Memory Layer Saver](https://github.com/YoannQDQ/qgis-memory-layer-saver) by Chris Crook and Yoann Quenach de Quivillic. Tested automatically on QGIS 3.40, 3.44 and 4.2 on Linux. Requires QGIS 3.40 or later."
            echo
            echo "**To install:** download \`MemoryLayerSaverDanzig-$VERSION.zip\`, then in QGIS use Plugins > Manage and Install Plugins > Install from ZIP. If you have 6.1.1 or earlier of this fork, uninstall it first."
            echo
            echo "## Changes"
            awk -v v="## [$VERSION]" 'index($0, v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$VERSION" "MemoryLayerSaverDanzig-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
